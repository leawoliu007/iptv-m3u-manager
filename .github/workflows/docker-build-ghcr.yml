name: Build Local ARMv7 Image

on:
  push:
    tags:
      - '*' 
  workflow_dispatch:
    inputs:
      image_tag:
        description: '手动指定镜像标签'
        required: true
        default: 'latest'

jobs:
  build-local:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 提取元数据（用于给 tar 里的镜像命名）
      - name: Set Image Metadata
        id: meta
        run: |
          # 决定镜像标签：优先使用 Git Tag，否则使用手动输入
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 2. 设置 ARM 编译环境
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 构建并导出为 tar 文件
      - name: Build and Export armv7
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/arm/v7
          # 这里的 tags 会写进 tar 包的元数据中
          tags: iptv-m3u-manager:${{ steps.meta.outputs.tag }}
          # 导出类型为 docker 格式的 tar 包
          outputs: type=docker,dest=./iptv-m3u-manager-armv7.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. 上传到 GitHub Actions 页面供下载
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-image-${{ steps.meta.outputs.tag }}
          path: ./iptv-m3u-manager-armv7.tar
          retention-days: 7
